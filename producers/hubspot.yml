# Virtual-join producers (see VIRTUAL_CYPHER.md in realm-spec), all over the curated `objectsSearch`
# read (POST /crm/v3/objects/{objectType}/search) except `ownersByEmail`.
#
# BATCH-keyed where the record carries the key: a search whose `filterGroups[].filters[].values`
# takes an `IN` list of every anchor key at once (`keyArg`), so a traversal over many anchors
# costs one search per page, not N.
#
# PER-KEY where the key is a HubSpot ASSOCIATION (`associations.contact`, `.company`, `.deal`):
# a search result does not say which associated record it matched, so these ask one key per call
# and stamp it back with `echoKeyAs`.
#
# Every search walks HubSpot's cursor (`after` → `paging.next.after`) 100 records a page, so an
# owner with more than one page of records is read whole rather than cut at HubSpot's default 10.
#
# HubSpot allows five search calls a second per portal, so every search producer shares one
# `hubspot-search` bucket paced at four a second; a traversal over 40 contacts waits rather than
# being refused with a 429.
# shortcut: a PER-KEY traversal (activities by contact) gets at most about 220 keys, the host's
# five converge windows of 40, before the engine answers UNSOLVABLE with rewrite advice; an owner
# with more contacts needs a narrower question or a batch association read the realm lacks today.

- name: contactsByEmail
  kind: api
  operation: objectsSearch
  cost: { bucket: hubspot-search, rate: 40/10s }
  records: "$.results[*].properties"
  keyArg: "filterGroups.0.filters.0.values"
  args:
    objectType: contacts
    properties: [hs_object_id, email, firstname, lastname, jobtitle, phone, company, associatedcompanyid, createdate, hs_lead_status, notes_last_activity_date, hubspot_owner_id, notes_last_contacted, notes_next_activity_date, hs_last_sales_activity_timestamp]
    filterGroups:
      - filters:
          - propertyName: email
            operator: IN
  paging: { style: cursor, size: 100, maxPages: 10, cursorParam: after, sizeParam: limit, cursorPath: "$.paging.next.after" }
  cache: { kind: ttl, seconds: 300 }

