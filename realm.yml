name: hubspot
description: "HubSpot CRM for sales and support questions: contacts, companies, deals, tickets and activities (calls, emails, meetings, notes, tasks), fetched live as virtual types and reached from owners, companies, contacts and deals. Deals, companies and contacts are an Opportunity, a CrmAccount and an AccountContact of the business vocabulary (realm-business-vocabulary, installed first), and a company's domain keys the CustomerAccount spine. Bundles a `hubspot-crm` skill that says which HubSpot date answers which question."
version: 0.4.0
author: Rod Johnson
maturity: experimental
url: https://github.com/johnsonr/realm-hubspot
